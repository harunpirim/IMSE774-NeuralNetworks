name: Build and publish course site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deployment finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.43
          tinytex: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Reuse previously executed code cells so unchanged notes are not re-run.
      - name: Restore Quarto freeze cache
        uses: actions/cache@v4
        with:
          path: _freeze
          key: freeze-${{ runner.os }}-${{ hashFiles('notes/**/*.qmd', '*.qmd') }}
          restore-keys: freeze-${{ runner.os }}-

      - name: Render website
        run: quarto render --to html

      # Each PDF lands next to its HTML in _site/, which is where the
      # "Other Formats" download link on each page points.
      - name: Render PDFs
        run: |
          for f in syllabus.qmd schedule.qmd notes/*.qmd; do
            quarto render "$f" --to pdf || echo "::warning::PDF render failed for $f"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
